<script>
let currentStep = 1;

function updateProgress() {

    const bar = document.getElementById("progressBar");

const widthMap = {
    1: "12.5%",
    2: "25%",
    3: "37.5%",
    4: "50%",
    5: "62.5%",
    6: "75%",
    7: "87.5%",
    8: "100%"
};

    bar.style.width = widthMap[currentStep];
}

function nextStep() {

    if (currentStep < 8) {
        currentStep++;
        updateProgress();
        showNew();
    }

}

function prevStep() {

    if (currentStep > 1) {
        currentStep--;
        updateProgress();
        showNew();
    }

}
