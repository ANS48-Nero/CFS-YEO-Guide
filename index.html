<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>여주센터 출근 가이드</title>

<style>
    :root {
        --cp-blue: #0073E9;
        --cp-blue-dark: #0058B3;
        --cp-blue-soft: #EBF4FF;
        --cp-red: #E52528;
        --cp-red-soft: #FFF0F0;
        --cp-amber-soft: #FFF8E6;
        --cp-amber-border: #FFB800;
        --cp-bg: #F0F2F5;
        --cp-surface: #FFFFFF;
        --cp-text: #111315;
        --cp-text-sub: #555E68;
        --cp-border: #E5E8EB;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 8px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
        background: var(--cp-bg);
        color: var(--cp-text);
        line-height: 1.6;
        padding-bottom: 92px; /* 하단 고정 네비게이션 여유 공간 */
    }

    /* 쿠팡 스타일 상단 헤더 */
    header {
        background: var(--cp-surface);
        border-bottom: 1px solid var(--cp-border);
        padding: 16px 18px 14px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-top {
        max-width: 600px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .brand-tag {
        display: inline-block;
        background: var(--cp-blue-soft);
        color: var(--cp-blue);
        font-size: 11px;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 999px;
        margin-bottom: 4px;
        letter-spacing: -0.2px;
    }

    header h1 {
        font-size: 19px;
        font-weight: 800;
        color: var(--cp-text);
        letter-spacing: -0.4px;
    }

    header p {
        font-size: 13px;
        color: var(--cp-text-sub);
        margin-top: 2px;
    }

    /* 진행률 바 */
    .progress-wrap {
        max-width: 600px;
        margin: 12px auto 0;
    }

    .progress-container {
        background: #E9ECEF;
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 11.1%;
        background: linear-gradient(90deg, var(--cp-blue), #2B8FF5);
        border-radius: 999px;
        transition: width 0.28s ease;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 14px 16px 0;
    }

    /* 기존 / 신규 인원 세그먼트 스위처 */
    .select-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        background: var(--cp-surface);
        padding: 6px;
        border-radius: var(--radius-md);
        border: 1px solid var(--cp-border);
        margin-bottom: 14px;
    }

    .select-btn {
        border: 1.5px solid transparent;
        border-radius: 9px;
        padding: 12px 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        background: transparent;
        color: var(--cp-text-sub);
        transition: all 0.18s ease;
    }

    .select-btn.active {
        background: var(--cp-blue);
        color: #FFFFFF;
        box-shadow: 0 3px 10px rgba(0, 115, 233, 0.25);
    }

    .select-btn:not(.active):active {
        background: #F4F6F8;
    }

    /* 카드 컴포넌트 */
    .card {
        background: var(--cp-surface);
        border-radius: var(--radius-lg);
        border: 1px solid var(--cp-border);
        padding: 18px 16px;
        margin-bottom: 14px;
    }

    .welcome {
        background: var(--cp-surface);
        border: 1.5px solid #BBD8FA;
    }

    .welcome-badge {
        display: inline-block;
        background: var(--cp-blue);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 6px;
        margin-bottom: 8px;
    }

    .step-header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding-bottom: 12px;
        margin-bottom: 14px;
        border-bottom: 1px solid var(--cp-border);
    }

    .step-count {
        background: var(--cp-blue-soft);
        color: var(--cp-blue);
        font-size: 12px;
        font-weight: 800;
        padding: 3px 9px;
        border-radius: 6px;
        margin-bottom: 6px;
    }

    .step-title {
        font-size: 19px;
        font-weight: 800;
        color: var(--cp-text);
        letter-spacing: -0.3px;
    }

    .step-desc {
        font-size: 15px;
        line-height: 1.72;
        color: var(--cp-text);
        margin-top: 10px;
    }

    /* 본문 이미지 + 확대 힌트 */
    .img-box {
        position: relative;
        margin: 12px 0;
    }

    .card img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: var(--radius-md);
        border: 1px solid var(--cp-border);
        background: #F4F6F8;
        cursor: zoom-in;
        transition: opacity 0.15s ease;
    }

    .card img:active {
        opacity: 0.88;
    }

    .img-hint {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--cp-text-sub);
        margin-top: 6px;
        font-weight: 600;
    }

    /* 안내 박스 / 리스트 */
    .callout-warn {
        background: var(--cp-red-soft);
        border-left: 4px solid var(--cp-red);
        color: var(--cp-text);
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        margin: 12px 0;
        font-size: 14px;
        font-weight: 700;
    }

    .callout-info {
        background: var(--cp-amber-soft);
        border-left: 4px solid var(--cp-amber-border);
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        margin: 12px 0;
        font-size: 14px;
    }

    .info-grid {
        background: #F8FAFC;
        border: 1px solid var(--cp-border);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        margin: 12px 0;
        font-size: 14px;
    }

    .info-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px dashed #E2E8F0;
    }

    .info-row:last-child {
        border-bottom: none;
    }

    .info-label {
        color: var(--cp-text-sub);
        font-weight: 600;
    }

    .info-val {
        font-weight: 800;
        color: var(--cp-text);
    }

    h2 {
        margin-bottom: 6px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.3px;
    }

    h3 {
        margin: 14px 0 8px;
        font-size: 16px;
        font-weight: 800;
        color: var(--cp-text);
    }

    p {
        margin-bottom: 10px;
        font-size: 15px;
        line-height: 1.68;
    }

    ul, ol {
        margin: 10px 0 12px 20px;
        font-size: 15px;
    }

    li {
        margin-bottom: 8px;
    }

    .welcome-list {
        counter-reset: item;
        list-style: none;
        margin: 12px 0 4px;
        padding: 0;
    }

    .welcome-list li {
        counter-increment: item;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        margin-bottom: 6px;
        background: #F8FAFC;
        border-radius: var(--radius-sm);
        font-size: 14.5px;
        font-weight: 700;
    }

    .welcome-list li::before {
        content: counter(item);
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--cp-blue);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    /* 하단 고정 네비게이션 바 */
    .nav-buttons {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--cp-surface);
        border-top: 1px solid var(--cp-border);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        z-index: 150;
        box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.05);
    }

    .nav-inner {
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        gap: 10px;
    }

    .nav-btn {
        flex: 1;
        border: none;
        border-radius: 10px;
        padding: 14px 12px;
        font-size: 15.5px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .prev-btn {
        background: #EEF1F4;
        color: var(--cp-text);
        max-width: 120px;
    }

    .next-btn {
        background: var(--cp-blue);
        color: #FFFFFF;
    }

    .nav-btn:active {
        opacity: 0.88;
        transform: scale(0.98);
    }

    /* 이미지 전체화면 확대 팝업(모달) 스타일 */
    #imageModal {
        display: none;
        position: fixed;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(10, 12, 16, 0.94);
        overflow: hidden;
        touch-action: none;
    }

    .modal-stage {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    #imageModal img {
        max-width: 100%;
        max-height: 85vh;
        width: auto;
        height: auto;
        border-radius: 6px;
        transform-origin: center center;
        user-select: none;
        -webkit-user-drag: none;
        touch-action: none;
    }

    .modal-close {
        position: fixed;
        top: 14px;
        right: 16px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        font-size: 26px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10000;
        line-height: 1;
    }

    .zoom-badge {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 700;
        z-index: 10000;
        pointer-events: none;
        white-space: nowrap;
    }
</style>
</head>

<body>

<header>
    <div class="header-top">
        <div>
            <span class="brand-tag">YEOJU CENTER</span>
            <h1>CFS 여주센터 출근 가이드</h1>
            <p>본인 근무 유형을 선택해 주세요.</p>
        </div>
    </div>
    <div class="progress-wrap">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>
</header>

<div class="container">

    <div class="select-area" role="tablist" aria-label="근무 유형 선택">
        <button class="select-btn" id="btnOld" onclick="switchMode('old')">
            기존 인원
        </button>
        <button class="select-btn active" id="btnNew" onclick="switchMode('new')">
            신규 인원
        </button>
    </div>

    <div id="content"></div>

</div>

<!-- 이미지 확대 모달(팝업) 레이어 -->
<div id="imageModal">
    <span class="modal-close" onclick="closeModal()" aria-label="닫기">&times;</span>
    <div class="modal-stage">
        <img id="modalImage" src="" alt="확대된 이미지">
    </div>
    <div class="zoom-badge" id="zoomBadge">130% · 두 손가락으로 확대/이동</div>
</div>

<script>
let currentMode = 'new'; // 'old' 또는 'new'
let currentStep = 1;

// 핀치 줌 및 이동 상태 변수 (초기 배율 130% = 1.3)
const MIN_SCALE = 1.0;
const MAX_SCALE = 4.0;
const INITIAL_SCALE = 1.3;

let scale = INITIAL_SCALE;
let posX = 0;
let posY = 0;

let isDragging = false;
let isPinching = false;
let hasMovedDuringTouch = false;
let startX = 0;
let startY = 0;
let initialPinchDist = 0;
let initialPinchScale = INITIAL_SCALE;

const modal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImage');
const zoomBadge = document.getElementById('zoomBadge');

function applyTransform() {
    modalImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    zoomBadge.textContent = `${Math.round(scale * 100)}% · 두 손가락으로 확대/이동`;
}

// 이미지 클릭 시 130% 배율로 모달창 열기
function openModal(src) {
    scale = INITIAL_SCALE;
    posX = 0;
    posY = 0;
    modalImg.src = src;
    applyTransform();
    modal.style.display = 'block';
}

// 모달창 닫기
function closeModal() {
    modal.style.display = 'none';
}

// 배경 클릭 시에만 닫기 (이미지 드래그/핀치 중에는 닫히지 않음)
function handleModalClick(event) {
    if (hasMovedDuringTouch) {
        hasMovedDuringTouch = false;
        return;
    }
    if (event.target === modal || event.target.classList.contains('modal-stage')) {
        closeModal();
    }
}

modal.addEventListener('click', handleModalClick);

function getDistance(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
}

modal.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
        isPinching = true;
        isDragging = false;
        hasMovedDuringTouch = true;
        initialPinchDist = getDistance(e.touches[0], e.touches[1]);
        initialPinchScale = scale;
    } else if (e.touches.length === 1) {
        isPinching = false;
        isDragging = true;
        hasMovedDuringTouch = false;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
    }
}, { passive: false });

modal.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && isPinching) {
        e.preventDefault();
        hasMovedDuringTouch = true;
        const currentDist = getDistance(e.touches[0], e.touches[1]);
        if (initialPinchDist > 0) {
            const nextScale = initialPinchScale * (currentDist / initialPinchDist);
            scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, nextScale));
            applyTransform();
        }
    } else if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        const nextX = e.touches[0].clientX - startX;
        const nextY = e.touches[0].clientY - startY;
        if (Math.abs(nextX - posX) > 4 || Math.abs(nextY - posY) > 4) {
            hasMovedDuringTouch = true;
        }
        posX = nextX;
        posY = nextY;
        applyTransform();
    }
}, { passive: false });

modal.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) {
        isPinching = false;
    }
    if (e.touches.length === 0) {
        isDragging = false;
    }
});

function renderImg(src, alt) {
    return `
        <div class="img-box">
            <img src="${src}" alt="${alt}" onclick="openModal(this.src)">
            <div class="img-hint">🔍 이미지를 탭하면 확대됩니다</div>
        </div>
    `;
}

function renderNav(hasPrev, hasNext) {
    return `
        <div class="nav-buttons">
            <div class="nav-inner">
                ${hasPrev ? `<button class="nav-btn prev-btn" onclick="prevStep()">◀ 이전</button>` : ''}
                ${hasNext ? `<button class="nav-btn next-btn" onclick="nextStep()">다음 ▶</button>` : ''}
            </div>
        </div>
    `;
}

function switchMode(mode) {
    currentMode = mode;
    currentStep = 1;

    document.getElementById('btnOld').classList.toggle('active', mode === 'old');
    document.getElementById('btnNew').classList.toggle('active', mode === 'new');

    updateProgress();
    renderContent();
}

function updateProgress() {
    const bar = document.getElementById("progressBar");

    if (currentMode === 'new') {
        const widthMap = {
            1: "11.1%",
            2: "22.2%",
            3: "33.3%",
            4: "44.4%",
            5: "55.5%",
            6: "66.6%",
            7: "77.7%",
            8: "88.8%",
            9: "100%"
        };
        bar.style.width = widthMap[currentStep] || "11.1%";
    } else {
        const widthMapOld = {
            1: "20%", 2: "40%", 3: "60%", 4: "80%", 5: "100%"
        };
        bar.style.width = widthMapOld[currentStep] || "20%";
    }
}

function nextStep() {
    const maxStep = (currentMode === 'new') ? 9 : 5;
    if (currentStep < maxStep) {
        currentStep++;
        updateProgress();
        renderContent();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function prevStep() {
    if (currentStep > 1) {
        currentStep--;
        updateProgress();
        renderContent();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// 기존 인원 각 단계별 함수
function showExistingStep1() {
    document.getElementById("content").innerHTML = `
    <div class="card">
        <div class="step-header">
            <div class="step-count">STEP 1 / 5</div>
            <div class="step-title">현재 위치 안내</div>
        </div>
        ${renderImg("images/여주센터_현재위치.jpg", "인도인접장 배치도")}
        <h3>STEP 1</h3>
        <p>쿠펀치 출근 체크인 후 인도인접장을 스캔해 주세요.</p>
        ${renderImg("images/YEO_인도인접장.jpg", "인도인접장")}
    </div>
    ${renderNav(false, true)}`;
}

function showExistingStep2() {
    currentStep = 2; updateProgress();
    document.getElementById("content").innerHTML = `
    <div class="card">
        <div class="step-header">
            <div class="step-count">STEP 2 / 5</div>
            <div class="step-title">쿠코드 출력</div>
        </div>
        ${renderImg("images/여주센터_쿠코드출력기.jpg", "쿠코드 출력기")}
        <h3>STEP 2</h3>
        <div class="callout-warn">
            ※ 이전 출력한 쿠코드가 있으시다면 다음으로 이동해주세요.<br>
            ※ 타센터 쿠코드 사용 가능
        </div>
        ${renderImg("images/YEO_쿠코드출력기.jpg", "쿠코드 출력기")}
    </div>
    ${renderNav(true, true)}`;
}

function showExistingStep3() {
    currentStep = 3; updateProgress();
    document.getElementById("content").innerHTML = `
    <div class="card">
        <div class="step-header">
            <div class="step-count">STEP 3 / 5</div>
            <div class="step-title">사물함 &amp; 안전화 착용</div>
        </div>
        ${renderImg("images/yeo_Map.jpg", "여주센터배치도")}
        <h3>STEP 3</h3>
        <p>2F 사물함 이용 및 안전화 착용 후 시업 시간까지 현장으로 이동해 주세요.</p>
        ${renderImg("images/여주센터_사물함안전화.jpg", "사물함&안전화")}
    </div>
    ${renderNav(true, true)}`;
}

function showExistingStep4() {
    currentStep = 4; updateProgress();
    document.getElementById("content").innerHTML = `
    <div class="card">
        <div class="step-header">
            <div class="step-count">STEP 4 / 5</div>
            <div class="step-title">퇴근 및 카드키 반납</div>
        </div>
        <h3>조퇴 안내</h3>
        <p>조퇴 시 현장 관리자님께 말씀 후 조퇴신청서를 작성해 주세요.</p>
        <ul>
            <li style="color:var(--cp-red);font-weight:800;">쿠펀치 체크아웃</li>
            <li>카드키 반납</li>
            <li>귀가</li>
        </ul>
        <h3>카드키 반납함 위치</h3>
        <div class="callout-warn">
            ⚠️ 퇴근 또는 조퇴 시 반드시 <span style="color:var(--cp-red);text-decoration:underline;">쿠펀치 체크아웃</span> 후 카드키를 반납해 주세요.
        </div>
        ${renderImg("images/YEO_퇴근_카드키반납함.jpg", "카드키 반납함")}
    </div>
    ${renderNav(true, true)}`;
}

function showExistingStep5() {
    currentStep = 5; updateProgress();
    document.getElementById("content").innerHTML = `
    <div class="card">
